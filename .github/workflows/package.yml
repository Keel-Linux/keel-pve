# Light CI on GitHub-hosted runners, for pull requests on the GitHub mirror
# (decision 0056). The full CI is .forgejo/workflows on git.pop.coop, and
# .forgejo/workflows/package.yml has the notes on each job.
name: package

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    uses: keel-linux/.github/.github/workflows/github-debian-build.yml@main
    with:
      timeout: 20
      artifact-dir: dist
      artifact-name: debs
      run: |
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends \
          ca-certificates devscripts equivs lintian
        (cd /tmp && mk-build-deps --install --remove \
          --tool 'apt-get -y -qq --no-install-recommends' /src/debian/control)
        dpkg-buildpackage -us -uc
        lintian --fail-on error,warning --info --display-info ../*.changes
        mkdir dist
        cp ../*.deb ../*.dsc ../*.tar.* ../*.buildinfo ../*.changes dist/
